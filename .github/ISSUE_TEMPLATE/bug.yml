name: Bug report
description: Report a reproducible problem using fictional data.
body:
  - type: markdown
    attributes:
      value: "Do not attach keys, profiles, JWTs, plans, backups or real account records. For security findings follow SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Fictional reproduction
      description: Command shape, expected behavior and sanitized error code.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: AppStoreAdmin, Python and OS versions.
