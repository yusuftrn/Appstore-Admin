name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python tools/run_tests.py
      - run: python -m bandit -c pyproject.toml -r src skills tools
      - run: python tools/check_distribution.py --tree . --tracked
      - run: python tools/build_release.py
      - run: python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Clean wheel smoke check
        run: |
          python -m venv /tmp/appstore-admin-smoke
          /tmp/appstore-admin-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/appstore-admin-smoke/bin/appstore-admin --help
          /tmp/appstore-admin-smoke/bin/python /tmp/appstore-admin-smoke/share/appstore-admin/skills/appstore-admin/scripts/admin.py --help
          /tmp/appstore-admin-smoke/bin/python -c 'from appstore_admin.config import schema_path; from appstore_admin.core import schema_at; assert schema_at(schema_path()).request_schema("appScreenshots", "post")'
